<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Desmos Academy</title>
  <link rel="stylesheet" href="styles.css"/>
  <script>
    // Load Desmos async — if it fails, the app shows a friendly fallback
    (function() {
      var s = document.createElement('script');
      s.src = 'https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
      s.async = true;
      s.onerror = function() { window.__DESMOS_FAILED = true; };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>

<!-- ░░░░░░ SPLASH ░░░░░░ -->
<div id="screen-splash" class="screen active">
  <canvas id="bg-canvas"></canvas>
  <div class="splash-inner">
    <div class="splash-badge">FREE · INTERACTIVE · FUN</div>
    <h1 class="splash-title">Desmos<br><span>Academy</span></h1>
    <p class="splash-sub">Master the world's most powerful<br>free graphing calculator — step by step.</p>

    <div class="lesson-map" id="lesson-map"></div>

    <button class="cta" id="btn-start">
      <span id="cta-label">Begin Journey</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <p class="splash-meta" id="splash-meta">7 lessons · 28 steps · free forever</p>
  </div>
</div>

<!-- ░░░░░░ LESSON ░░░░░░ -->
<div id="screen-lesson" class="screen">
  <!-- Top bar -->
  <div class="topbar">
    <button class="topbar-back" id="btn-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Menu
    </button>
    <div class="topbar-center">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="topbar-xp" id="topbar-xp">⭐ 0</div>
  </div>

  <!-- Body -->
  <div class="lesson-body">
    <!-- Panel -->
    <div class="panel" id="panel">
      <div class="panel-header" id="panel-header">
        <div class="lesson-tag" id="lesson-tag"></div>
        <h2 id="lesson-title"></h2>
        <p id="lesson-sub"></p>
      </div>

      <div class="step-nav" id="step-nav"></div>

      <div class="panel-content" id="panel-content"></div>

      <div class="panel-footer" id="panel-footer"></div>
    </div>

    <!-- Calc -->
    <div class="calc-wrap">
      <div class="calc-topbar">
        <div class="calc-title" id="calc-title">Desmos Calculator</div>
        <a href="https://desmos.com/calculator" target="_blank" class="calc-open-btn">Open full ↗</a>
      </div>
      <div id="calculator"></div>
      <div class="calc-footer" id="calc-footer"></div>
    </div>
  </div>
</div>

<!-- ░░░░░░ QUIZ OVERLAY ░░░░░░ -->
<div id="overlay-quiz" class="overlay hidden">
  <div class="card quiz-card">
    <div class="quiz-emo" id="quiz-emo"></div>
    <p class="quiz-q" id="quiz-q"></p>
    <div class="quiz-opts" id="quiz-opts"></div>
    <div class="quiz-fb hidden" id="quiz-fb"></div>
  </div>
</div>

<!-- ░░░░░░ WIN OVERLAY ░░░░░░ -->
<div id="overlay-win" class="overlay hidden">
  <canvas id="win-canvas"></canvas>
  <div class="card win-card">
    <div class="win-icon" id="win-icon"></div>
    <h3 id="win-title"></h3>
    <p id="win-msg"></p>
    <div class="win-xp" id="win-xp"></div>
    <button class="cta" id="btn-next">Next Lesson →</button>
  </div>
</div>

<!-- ░░░░░░ GRAD ░░░░░░ -->
<div id="screen-grad" class="screen hidden">
  <canvas id="grad-canvas"></canvas>
  <div class="grad-inner">
    <div class="grad-trophy">🏆</div>
    <h1>Course Complete!</h1>
    <p class="grad-sub">You've mastered all 7 Desmos lessons.</p>
    <div class="grad-pills" id="grad-pills"></div>
    <a href="https://www.desmos.com/calculator" target="_blank" class="cta">Open Desmos →</a>
    <button class="ghost-btn" id="btn-restart">Restart</button>
  </div>
</div>

<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
